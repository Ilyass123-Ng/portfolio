<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Vibrant Energetic Gradient Badge -->
    <linearGradient id="ieBadgeGrad" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF6B2B"/>
      <stop offset="50%" stop-color="#FF5113"/>
      <stop offset="100%" stop-color="#D43200"/>
    </linearGradient>
    
    <!-- Subtle Inner Top Highlight -->
    <linearGradient id="topSheen" x1="24" y1="0" x2="24" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Soft Letter Shadow for Depth -->
    <filter id="letterDepth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.5" flood-color="#550f00" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Badge Background Squircle -->
  <rect width="48" height="48" rx="13" fill="url(#ieBadgeGrad)"/>
  
  <!-- Subtle Top Rim Sheen -->
  <rect x="0.75" y="0.75" width="46.5" height="46.5" rx="12.25" stroke="url(#topSheen)" stroke-width="1.5"/>
  <rect x="0.5" y="0.5" width="47" height="47" rx="12.5" stroke="rgba(0,0,0,0.18)" stroke-width="1"/>

  <!-- Unmistakable & Bold "IE" Monogram (Ilyas Ennajy) -->
  <g fill="#FFFFFF" filter="url(#letterDepth)">
    <!-- Letter 'I' (Centered at x=8..21) -->
    <rect x="7.5" y="11" width="13" height="3.5" rx="1.2"/>
    <rect x="12.25" y="11" width="3.5" height="26" rx="1.2"/>
    <rect x="7.5" y="33.5" width="13" height="3.5" rx="1.2"/>

    <!-- Letter 'E' (Centered at x=26..40.5) -->
    <rect x="26" y="11" width="3.5" height="26" rx="1.2"/>
    <rect x="26" y="11" width="14.5" height="3.5" rx="1.2"/>
    <rect x="26" y="22.25" width="11" height="3.5" rx="1.2"/>
    <rect x="26" y="33.5" width="14.5" height="3.5" rx="1.2"/>
  </g>
</svg>